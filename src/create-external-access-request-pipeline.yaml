name: simple-pipeline

datahub:
  server: "${DATAHUB_URL}"
  token: "${DATAHUB_TOKEN}"

source:
  type: "datahub-cloud"

filter:
    event_type: "EntityChangeEvent_v1"
    event:
        entityType: "actionRequest"
        parameters:
            actionRequestType: "WORKFLOW_FORM_REQUEST"
            workflowId: "<workflow-id>"

options:
  failure_mode: "THROW"

action:
  type: create_external_access_request_action
  config:
    external_uri: http://localhost:8000/create_request
