# Glossary Approval (Requirement #4): listens for TERM_ASSOCIATION and
# CREATE_GLOSSARY_TERM proposals. Logs and optionally forwards to external_uri.
name: glossary-proposal-pipeline

datahub:
  server: "${DATAHUB_URL}"
  token: "${DATAHUB_TOKEN}"

source:
  type: "datahub-cloud"

# Accept all entity change events so we can see what DataHub sends for glossary proposals
filter:
  event_type: "EntityChangeEvent_v1"

options:
  failure_mode: "THROW"

action:
  type: glossary_proposal_action
  config:
    external_uri: "http://localhost:8000/glossary_proposals"
