name: grant-external-permissions-pipeline

datahub:
  server: "${DATAHUB_URL}"
  token: "${DATAHUB_TOKEN}"

source:
  type: "datahub-cloud"

filter:
    event_type: "EntityChangeEvent_v1"
    event:
        entityType: "actionRequest"
        parameters:
            actionRequestType: "WORKFLOW_FORM_REQUEST"
            # Optional: uncomment to only receive approvals for this workflow (useful if you have one workflow).
            # workflowId: "ba3dc137-eb40-45ed-b9a3-5ba2e2dcd2d1"

options:
  failure_mode: "THROW"

action:
  type: grant_external_permissions_action
  config:
    external_uri: http://localhost:8000/grant_permissions
