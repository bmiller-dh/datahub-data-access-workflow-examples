name: simple-pipeline

datahub:
  server: "https://<instance-name>.acryl.io"
  token: "<personal access token>"

source:
  type: "datahub-cloud"

filter:
    event_type: "EntityChangeEvent_v1"
    event:
        entityType: "actionRequest"
        parameters:
            actionRequestType: "WORKFLOW_FORM_REQUEST"
            workflowId: "<workflow-id>"

options:
  failure_mode: "THROW"

action:
  type: simple_action
  config: {}
