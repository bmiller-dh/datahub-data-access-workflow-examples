# Asset Certification (Requirement #2): listens for STRUCTURED_PROPERTY changes
# on entities (e.g. from Compliance Forms). Logs and optionally forwards to external_uri.
name: certification-event-pipeline

datahub:
  server: "${DATAHUB_URL}"
  token: "${DATAHUB_TOKEN}"

source:
  type: "datahub-cloud"

filter:
  event_type: "EntityChangeEvent_v1"
  event:
    category: "STRUCTURED_PROPERTY"

options:
  failure_mode: "THROW"

action:
  type: certification_event_action
  config:
    external_uri: "http://localhost:8000/certification_events"
