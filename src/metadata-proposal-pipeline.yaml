# Metadata Approval (Requirement #3): listens for metadata proposal events
# (TAG_ASSOCIATION, OWNER_ASSOCIATION, DOMAIN_ASSOCIATION, UPDATE_DESCRIPTION,
# STRUCTURED_PROPERTY_ASSOCIATION). Logs and optionally forwards to external_uri.
name: metadata-proposal-pipeline

datahub:
  server: "${DATAHUB_URL}"
  token: "${DATAHUB_TOKEN}"

source:
  type: "datahub-cloud"

filter:
  event_type: "EntityChangeEvent_v1"
  event:
    entityType: "actionRequest"
    category: "LIFECYCLE"
    operation: "CREATE"

options:
  failure_mode: "THROW"

action:
  type: metadata_proposal_action
  config:
    external_uri: "http://localhost:8000/metadata_proposals"
